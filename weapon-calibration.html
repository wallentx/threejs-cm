<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MAS-36 Silhouette Calibration</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #9fbed3; color: #17202a; font-family: Inter, system-ui, sans-serif; }
    body { display: grid; grid-template-rows: auto 1fr; gap: 10px; padding: 10px; }
    header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 9px 12px; border: 1px solid #647789; border-radius: 8px; background: rgba(239, 246, 250, 0.92); }
    h1 { margin: 0; font-size: 1rem; }
    label { display: flex; align-items: center; gap: 7px; font-size: 0.82rem; font-weight: 700; }
    select { padding: 4px 7px; }
    #comparison-metrics { flex: 1 1 100%; font: 0.74rem ui-monospace, monospace; }
    .legend { display: flex; gap: 12px; font-size: 0.72rem; font-weight: 700; }
    .legend span::before { display: inline-block; width: 10px; height: 10px; margin-right: 4px; border-radius: 2px; content: ''; }
    .source::before { background: #ef4444; }
    .model::before { background: #06b6d4; }
    .overlap::before { background: #111827; }
    main { display: grid; place-items: center; min-height: 0; overflow: auto; border: 1px solid #647789; border-radius: 8px; background: #d9e8f1; }
    canvas { display: block; width: min(100%, 1600px); height: auto; image-rendering: auto; }
  </style>
</head>
<body data-calibration-status="loading">
  <header>
    <h1>MAS-36 deterministic silhouette jig</h1>
    <label>View <select disabled><option>Side (+X)</option></select></label>
    <label>Display
      <select id="comparison-mode">
        <option value="difference">Difference</option>
        <option value="overlay">Overlay</option>
        <option value="source">SVG silhouette</option>
        <option value="model">Model silhouette</option>
      </select>
    </label>
    <div class="legend"><span class="source">Missing model</span><span class="model">Excess model</span><span class="overlap">Overlap</span></div>
    <output id="comparison-metrics">Loading source and model geometry...</output>
  </header>
  <main><canvas id="comparison-canvas"></canvas></main>
  <script type="module" src="./src/weapon-calibration.js"></script>
</body>
</html>
